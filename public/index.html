<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Souk – petites annonces</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6faf9;--surface:#fff;--ink:#10302e;--muted:#52706d;--line:#cfe0dd;--teal:#0f6b66;--sun:#f2a900;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d1c;--surface:#12302e;--ink:#e6f4f2;--muted:#9bbcb8;--line:#255250}}
:root[data-theme="dark"]{--bg:#0b1d1c;--surface:#12302e;--ink:#e6f4f2;--muted:#9bbcb8;--line:#255250}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;max-width:1080px;margin:auto}
h1{margin:0;font-size:30px;font-weight:800}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sell{background:var(--sun);color:#2a1d00;border:0;border-radius:10px;padding:11px 18px;font-weight:800}
main{max-width:1080px;margin:auto;padding:0 20px 60px}
.lead{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.body{padding:14px;display:flex;flex-direction:column;gap:6px}
.price{font-weight:800;font-size:22px;color:var(--teal)}
.meta{color:var(--muted);font-size:14px}
.link{background:none;border:0;padding:0;color:var(--teal);font-weight:600;text-align:left}
.cmts p{margin:6px 0;font-size:15px}
input,select{width:100%;padding:11px;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.send{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:440px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 14px}.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:12px}.tools input,.tools select{margin:0}
.sold img,.sold .price,.sold .ttl{opacity:.5}.badge{background:var(--sun);color:#2a1d00;font-weight:800;border-radius:6px;padding:2px 8px;font-size:13px;width:fit-content}
.wa{background:#1fa855;color:#fff;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:600;text-align:center}
.acts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
@media(max-width:600px){.tools{grid-template-columns:1fr 1fr}.tools input[type=search]{grid-column:1/-1}}
.empty{padding:40px 0;color:var(--muted)}
#msg{font-weight:600;margin-top:8px}
</style>
</head>
<body>
<header><h1>Souk</h1><button class="sell" id="open">Vendre un article</button></header>
<main>
 <p class="lead">Prends ton article en photo, fixe ton prix. Les acheteurs te répondent en commentaire.</p>
 <div class="tools">
  <input id="q" type="search" placeholder="Chercher un article…" aria-label="Chercher">
  <input id="max" type="number" min="1" placeholder="Prix max (DT)" inputmode="decimal" aria-label="Prix maximum">
  <select id="sort" aria-label="Trier"><option value="new">Plus récents</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select>
 </div>
 <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
 <div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
 <form id="form" method="dialog">
  <h2 style="margin-top:0">Vendre un article</h2>
  <label for="photo">Photo</label><input id="photo" type="file" accept="image/*" required>
  <label for="title">Article</label><input id="title" maxlength="80" required>
  <label for="cat">Catégorie</label><select id="cat" required></select>
  <input id="catOther" placeholder="Écris ta catégorie" maxlength="30" hidden>
  <label for="price">Ton prix (DT)</label><input id="price" type="number" min="1" step="any" inputmode="decimal" required>
  <label for="seller">Ton prénom</label><input id="seller" maxlength="40" required>
  <label for="phone">Téléphone (8 chiffres)</label><input id="phone" type="tel" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" title="8 chiffres" required>
  <label for="code">Code secret pour supprimer l’annonce</label><input id="code" maxlength="20" required>
  <button class="send" type="submit">Publier</button> <button class="link" type="button" id="cancel">Annuler</button>
  <div id="msg" role="status"></div>
 </form>
</dialog>

<script>
const $=s=>document.querySelector(s);
const h=(t,p={},...c)=>{const e=document.createElement(t);Object.assign(e,p);c.flat().forEach(x=>e.append(x));return e};
const api=(u,o)=>fetch(u,o).then(r=>{if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()});
const open=new Set();
const CATS=["Téléphones","Électronique","Vêtements","Maison","Voitures","Beauté","Sport","Autre"];
CATS.forEach(c=>$("#cat").append(h("option",{value:c,textContent:c})));
$("#cat").onchange=()=>{const o=$("#cat").value==="Autre";$("#catOther").hidden=!o;$("#catOther").required=o};
let all=[],cur="Tout";

function resize(file){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{
 const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");
 c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 ok(c.toDataURL("image/jpeg",.8))};img.onerror=ko;img.src=URL.createObjectURL(file)})}

function card(it){
 const box=h("div",{className:"cmts",hidden:!open.has(it.id)});
 it.comments.forEach(c=>box.append(h("p",{},h("b",{textContent:c.name+" : "}),c.text)));
 const n=h("input",{placeholder:"Ton prénom",maxLength:40}),t=h("input",{placeholder:"Ton commentaire (ex. : je le prends)",maxLength:300});
 const b=h("button",{className:"send",textContent:"Commenter",onclick:async()=>{
  if(!n.value.trim()||!t.value.trim())return;
  try{await api(`/api/items/${it.id}/comments`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,text:t.value})});open.add(it.id);load()}
  catch(e){alert("Commentaire non envoyé. Réessaie.")}}});
 box.append(n,t,b);
 const tog=h("button",{className:"link",textContent:`Commentaires (${it.comments.length})`,onclick:()=>{box.hidden=!box.hidden;box.hidden?open.delete(it.id):open.add(it.id)}});
 const own=async(method,body)=>{const code=prompt("Code secret de l’annonce :");if(!code)return;
  try{await api(`/api/items/${it.id}?code=${encodeURIComponent(code)}`,{method,headers:{"Content-Type":"application/json"},body:body&&JSON.stringify(body)});load()}catch(e){alert("Code incorrect.")}};
 const act=(label,fn)=>h("button",{className:"link",textContent:label,onclick:fn});
 const acts=h("div",{className:"acts"},
  act(it.sold?"Remettre en vente":"Marquer vendu",()=>own("PATCH",{sold:!it.sold})),
  act("Changer le prix",()=>{const p=+prompt("Nouveau prix (DT) :");if(p>0)own("PATCH",{price:p})}),
  act("Supprimer",()=>own("DELETE")),
  act("Signaler",async()=>{try{await api(`/api/items/${it.id}/report`,{method:"POST"});alert("Merci, l’annonce est signalée.")}catch(e){alert("Réessaie plus tard.")}}));
 const d=(it.phone||"").replace(/\D/g,""),num=d.length===8?"216"+d:d;
 const wa=num&&!it.sold?h("a",{className:"wa",textContent:"Écrire sur WhatsApp",target:"_blank",rel:"noopener",
  href:`https://wa.me/${num}?text=${encodeURIComponent("Bonjour, je suis intéressé par « "+it.title+" » à "+it.price+" DT (Souk)")}`}):"";
 return h("article",{className:"card"+(it.sold?" sold":"")},h("img",{src:it.photo,alt:it.title,loading:"lazy"}),
  h("div",{className:"body"},it.sold?h("span",{className:"badge",textContent:"Vendu"}):"",h("div",{className:"price",textContent:it.price+" DT"}),h("div",{className:"ttl",textContent:it.title,style:"font-weight:600"}),
  h("div",{className:"meta",textContent:(it.category||"Autre")+" · Vendeur : "+it.seller+(it.phone?" · "+it.phone:"")}),wa,tog,box,acts))}

function show(){
 const used=[...new Set(all.map(i=>i.category||"Autre"))];
 const list=["Tout",...CATS.slice(0,-1),...used.filter(c=>!CATS.includes(c)),"Autre"];
 $("#chips").replaceChildren(...list.map(c=>h("button",{className:"chip"+(c===cur?" on":""),textContent:c,onclick:()=>{cur=c;show()}})));
 const q=$("#q").value.trim().toLowerCase(),mx=+$("#max").value||Infinity,s=$("#sort").value;
 const items=all.filter(i=>(cur==="Tout"||(i.category||"Autre")===cur)&&i.title.toLowerCase().includes(q)&&i.price<=mx);
 if(s==="asc")items.sort((a,b)=>a.price-b.price);if(s==="desc")items.sort((a,b)=>b.price-a.price);
 items.sort((a,b)=>!!a.sold-!!b.sold);
 $("#grid").replaceChildren(...items.map(card));
 if(!items.length)$("#grid").append(h("p",{className:"empty",textContent:"Aucune annonce trouvée. Change ta recherche ou sois le premier à vendre."}))}
async function load(){try{all=await api("/api/items");show()}
 catch(e){$("#grid").replaceChildren(h("p",{className:"empty",textContent:"Impossible de charger les annonces. Vérifie que le serveur tourne."}))}}

$("#phone").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,8);
["#q","#max","#sort"].forEach(s=>$(s).oninput=show);
$("#open").onclick=()=>$("#dlg").showModal();
$("#cancel").onclick=()=>$("#dlg").close();
$("#form").onsubmit=async e=>{e.preventDefault();$("#msg").textContent="Envoi…";
 try{const photo=await resize($("#photo").files[0]);
  await api("/api/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({photo,title:$("#title").value,category:$("#cat").value==="Autre"?($("#catOther").value.trim()||"Autre"):$("#cat").value,price:+$("#price").value,seller:$("#seller").value,phone:$("#phone").value,code:$("#code").value})});
  $("#form").reset();$("#catOther").hidden=true;$("#msg").textContent="";$("#dlg").close();load()}
 catch(err){$("#msg").textContent="Annonce non publiée. Vérifie les champs et réessaie."}};
load();
</script>
</body>
</html>

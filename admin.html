<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Souk – Admin</title>
<style>
:root{--bg:#f6faf9;--surface:#fff;--ink:#10302e;--muted:#52706d;--line:#cfe0dd;--teal:#0f6b66;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1d1c;--surface:#12302e;--ink:#e6f4f2;--muted:#9bbcb8;--line:#255250;--red:#ff8a80}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:auto}h1{margin:0 0 4px}h2{margin:28px 0 10px;font-size:20px}
.muted{color:var(--muted)}button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start}.row img{width:84px;height:84px;object-fit:cover;border-radius:8px;background:var(--line)}
.grow{flex:1;min-width:0}.badge{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;background:var(--red);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btns button,.add button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px}
.btns .del{border-color:var(--red);color:var(--red)}
.cm{font-size:14px;margin:4px 0;display:flex;gap:8px}.cm button{border:0;background:none;color:var(--red);font-weight:700}
input{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:0 6px 6px 0}
.tag button{border:0;background:none;color:var(--red);font-weight:700}
</style>
</head>
<body>
<main>
 <h1>Souk – Administration</h1>
 <p class="muted" id="stats">Chargement…</p>
 <h2>Numéros bloqués</h2>
 <div class="box"><div id="banned"></div>
  <div class="add"><input id="bp" inputmode="numeric" maxlength="8" placeholder="8 chiffres" aria-label="Numéro à bloquer"> <button id="bb">Bloquer</button></div></div>
 <h2>Annonces</h2>
 <div id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const h=(t,p={},...c)=>{const e=document.createElement(t);Object.assign(e,p);c.flat().forEach(x=>e.append(x));return e};
let key=sessionStorage.getItem("k")||"";
async function api(u,o={}){
 o.headers={"Content-Type":"application/json","x-admin-key":key};
 const r=await fetch(u,o);
 if(r.status===401){key=prompt("Clé admin :")||"";if(!key)throw new Error("401");sessionStorage.setItem("k",key);return api(u,o)}
 if(!r.ok)throw new Error(r.status);
 return r.status===204?null:r.json()}
const act=async(u,m,b)=>{try{await api(u,{method:m,body:b&&JSON.stringify(b)});load()}catch(e){alert("Action impossible ("+e.message+")")}};

async function load(){
 try{
  const [items,ban]=await Promise.all([api("/api/admin/items"),api("/api/admin/banned")]);
  const hid=i=>i.hidden||i.reports>=3;
  $("#stats").textContent=`${items.length} annonces, ${items.filter(i=>i.reports>0).length} signalées, ${items.filter(hid).length} cachées au public`;
  $("#banned").replaceChildren(...(ban.length?ban.map(p=>h("span",{className:"tag"},p,h("button",{textContent:"✕","aria-label":"Débloquer "+p,onclick:()=>act("/api/admin/ban/"+p,"DELETE")}))):[h("span",{className:"muted",textContent:"Aucun numéro bloqué. "})]));
  $("#list").replaceChildren(...items.map(i=>h("div",{className:"box"},
   h("div",{className:"row"},h("img",{src:i.photo,alt:i.title}),
    h("div",{className:"grow"},
     h("b",{textContent:i.title+" – "+i.price+" DT"}),
     h("div",{className:"muted",textContent:i.category+" · "+i.seller+" · "+i.phone+(i.sold?" · vendu":"")}),
     i.reports?h("span",{className:"badge",textContent:i.reports+" signalement(s)"}):"",
     hid(i)?h("span",{className:"badge",textContent:"Caché",style:"margin-left:6px"}):"",
     ...i.comments.map((c,n)=>h("div",{className:"cm"},h("span",{textContent:c.name+" : "+c.text}),h("button",{textContent:"✕","aria-label":"Supprimer le commentaire",onclick:()=>confirm("Supprimer ce commentaire ?")&&act(`/api/admin/items/${i.id}/comments/${n}`,"DELETE")})))
    )),
   h("div",{className:"btns"},
    h("button",{textContent:hid(i)?"Rendre visible":"Cacher",onclick:()=>act("/api/admin/items/"+i.id,"PATCH",hid(i)?{hidden:false,clearReports:true}:{hidden:true})}),
    i.reports?h("button",{textContent:"Effacer les signalements",onclick:()=>act("/api/admin/items/"+i.id,"PATCH",{clearReports:true})}):"",
    h("button",{className:"del",textContent:"Supprimer",onclick:()=>confirm("Supprimer cette annonce ?")&&act("/api/admin/items/"+i.id,"DELETE")}),
    h("button",{className:"del",textContent:"Supprimer et bloquer le numéro",onclick:async()=>{if(!confirm("Supprimer l’annonce et bloquer "+i.phone+" ?"))return;
     try{await api("/api/admin/ban",{method:"POST",body:JSON.stringify({phone:i.phone})});await api("/api/admin/items/"+i.id,{method:"DELETE"});load()}catch(e){alert("Action impossible")}}}))))
  );
  if(!items.length)$("#list").append(h("p",{className:"muted",textContent:"Aucune annonce."}));
 }catch(e){$("#stats").textContent="Accès refusé ou serveur indisponible. Recharge la page."}}
$("#bp").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,8);
$("#bb").onclick=()=>{const p=$("#bp").value;if(p.length!==8)return alert("Le numéro doit avoir 8 chiffres.");act("/api/admin/ban","POST",{phone:p});$("#bp").value=""};
load();
</script>
</body>
</html>
